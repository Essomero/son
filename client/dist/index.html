<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Son — voice agent</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e222b;
      --border: #2a2f3a;
      --text: #e8eaee;
      --muted: #9aa3b2;
      --accent: #f0c674;
      --accent-ink: #17130a;
      --user: #7fb3ff;
      --bot: #c9a66b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header {
      padding: 20px 24px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    header h1 { margin: 0; font-size: 20px; letter-spacing: 0.5px; }
    header h1 span { color: var(--accent); }
    #status { color: var(--muted); font-size: 13px; flex: 1; }
    #settings-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 17px;
      line-height: 1;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    #settings-btn:hover { color: var(--text); background: var(--panel); }

    /* Settings modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal-overlay[hidden] { display: none; }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      width: min(440px, 92vw);
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal h2 { margin: 0 0 4px; }
    .modal .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field select {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      cursor: pointer;
    }
    .field .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
    .modal-actions { display: flex; justify-content: flex-end; margin-top: 18px; }
    .modal-actions button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 18px;
      font: inherit;
      cursor: pointer;
    }
    .modal-actions button:hover { border-color: var(--muted); }
    main { max-width: 720px; margin: 0 auto; padding: 24px; }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
    #roles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
    .role-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font: inherit;
      transition: border-color 0.15s, background 0.15s;
    }
    .role-card:hover { border-color: var(--muted); }
    .role-card.selected { border-color: var(--accent); background: var(--panel-2); }
    .role-name { font-weight: 600; }
    .role-desc { color: var(--muted); font-size: 13px; }
    .empty { color: var(--muted); }
    code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }

    #connect {
      margin-top: 18px;
      background: var(--accent);
      color: var(--accent-ink);
      border: none;
      border-radius: 10px;
      padding: 12px 26px;
      font: 600 15px inherit;
      cursor: pointer;
    }
    #connect:disabled { opacity: 0.4; cursor: default; }

    #transcript {
      margin-top: 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .row { display: flex; gap: 10px; align-items: baseline; }
    .who { font-size: 12px; font-weight: 700; min-width: 34px; }
    .row.user .who { color: var(--user); }
    .row.bot .who { color: var(--bot); }
    .text { word-break: break-word; }

    #controls { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
    #compose { display: flex; gap: 10px; align-items: flex-end; }
    #text-input {
      flex: 1;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font: inherit;
      resize: none;
      overflow-y: auto;
      min-height: 38px;
      max-height: 160px;
      line-height: 1.4;
    }
    #text-input:focus { outline: none; border-color: var(--muted); }
    #text-input::placeholder { color: var(--muted); }
    #controls-actions { display: flex; gap: 10px; }
    #controls button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 18px;
      font: inherit;
      cursor: pointer;
    }
    #controls button:hover { border-color: var(--muted); }
    #controls button:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>Son<span>·</span></h1>
    <div id="status">Pick a role to start talking.</div>
    <button id="settings-btn" title="Model settings" aria-label="Model settings">⚙</button>
  </header>
  <div id="settings-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title">Model settings</h2>
      <p class="sub">Picked per session — they apply the next time you connect.</p>
      <div class="field">
        <label for="set-llm">Brain</label>
        <select id="set-llm"></select>
        <div class="hint">Reasoning / chat model behind the replies.</div>
      </div>
      <div class="field">
        <label for="set-stt">Speech-to-text</label>
        <select id="set-stt"></select>
        <div class="hint">Transcribes your voice.</div>
      </div>
      <div class="field">
        <label for="set-tts">Voice</label>
        <select id="set-tts"></select>
        <div class="hint">Reads the replies aloud. Kokoro voices run locally.</div>
      </div>
      <div class="modal-actions">
        <button id="settings-close">Close</button>
      </div>
    </div>
  </div>
  <main>
    <h2>Who do you want to talk to?</h2>
    <div id="roles"></div>
    <button id="connect" disabled>Connect</button>
    <div id="transcript" aria-live="polite"></div>
    <div id="controls" hidden>
      <div id="compose">
        <textarea id="text-input" rows="1" placeholder="Type or paste a message… (Enter to send, Shift+Enter for a new line)"></textarea>
        <button id="send">Send</button>
      </div>
      <div id="controls-actions">
        <button id="mute" disabled>Mute</button>
        <button id="disconnect">End session</button>
      </div>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
