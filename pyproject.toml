[project]
name = "son"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    # Extras = the providers son.py imports: kokoro/webrtc (core), google
    # (LLM+STT+TTS), groq (LLM+STT+TTS), openrouter+cerebras+deepseek (LLM).
    "pipecat-ai[cerebras,deepseek,google,groq,kokoro,openrouter,rnnoise,webrtc]>=1.7.0",
    "sherpa-onnx>=1.13.5",
    # The C++ core ships as a separate wheel (dynamic Requires-Dist — uv skips
    # it), and the macOS sherpa-onnx wheel can't dlopen without it.
    "sherpa-onnx-core==1.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.3",
    "torch>=2.13.0",
    "transformers>=5.15.1",
    "datasets>=5.0.1",
    "accelerate>=1.14.0",
    "soundfile>=0.14.0",
    "jiwer>=4.0.0",
    # Direct dep since 2026-08-20: the multiband AGC (audio_filters.py) uses
    # scipy.signal.lfilter for its crossover chains; previously transitive.
    "scipy>=1.11.0",
    "python-multipart>=0.0.32",
]
